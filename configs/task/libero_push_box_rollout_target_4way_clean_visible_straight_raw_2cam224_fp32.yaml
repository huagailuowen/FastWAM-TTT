# @package _global_

defaults:
  - override /data: libero_push_box_rollout_target_4way_clean_visible_straight_2cam
  - override /model: fastwam
  - _self_

batch_size: 4
num_workers: 4
gradient_accumulation_steps: 4
mixed_precision: "no"

model:
  mot_checkpoint_mixed_attn: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

lr_scheduler_type: "cosine"
learning_rate: 2.0e-5
num_epochs: 1
max_steps: 10000
log_every: 5
save_every: 1000
keep_last_checkpoints: 2
eval_every: 0
eval_num_inference_steps: 10

weight_decay: 1.0e-2
resume: ./checkpoints/fastwam_release/libero_uncond_2cam224.pt

wandb:
  enabled: false
  name: libero_push_box_rollout_target_4way_clean_visible_straight_raw_2cam224_fp32
