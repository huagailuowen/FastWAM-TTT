# @package _global_

defaults:
  - override /data: ttt_dynamic_carrier_slow100_observe10_2cam
  - override /model: fastwam
  - _self_

batch_size: 16
num_workers: 4
gradient_accumulation_steps: 1

data:
  train:
    # Raw SFT trains only on execution chunks. The passive 100-frame prefix is
    # metadata/context for TTT variants, not an action target for the raw policy.
    action_video_freq_ratio: 2
    stage1_execution_only: true
    ttt_observation_instruction: null

model:
  mot_checkpoint_mixed_attn: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

lr_scheduler_type: "cosine"
learning_rate: 2.0e-5
num_epochs: 1
max_steps: 10000
log_every: 5
save_every: 1000
keep_last_checkpoints: 2
eval_every: 0
eval_num_inference_steps: 10

weight_decay: 1.0e-2
resume: ./checkpoints/fastwam_release/libero_uncond_2cam224.pt

wandb:
  enabled: false
  name: ttt_dynamic_carrier_slow100_raw_2cam224_ft
