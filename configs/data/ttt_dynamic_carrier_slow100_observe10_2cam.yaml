train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoTTTGroupedDataset
  dataset_dirs:
    - ./data/ttt_dynamic_carrier_slow100_observe10_shard00_lerobot
    - ./data/ttt_dynamic_carrier_slow100_observe10_shard01_lerobot
    - ./data/ttt_dynamic_carrier_slow100_observe10_shard02_lerobot
    - ./data/ttt_dynamic_carrier_slow100_observe10_shard03_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 2
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  restart_instruction: null
  ttt_mode: observe_then_act
  tries_per_group: 1
  observe_chunks: 30
  chunk_interval: 2
  execution_chunk_interval: 10
  observe_frames: null
  observe_frames_min: 40
  observe_frames_max: 60
  random_observe_frames: true
  policy_update_during_execution: true
  ttt_time_stride: 2
  ttt_observation_instruction: "observe the motion trajectory of the object that needs to be grasped; do not take any action"
  entry_repeat: 8
  pretrained_norm_stats: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/ttt_dynamic_carrier_slow100_observe10
  context_len: 128
